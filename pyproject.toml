[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ridethrough"
version = "0.6.0"
description = "An open grader for data centre voltage ride-through claims"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Yasha Khandelwal", email = "yasha.khandelwal@tech4biz.io" },
]
keywords = [
    "ride-through",
    "voltage ride-through",
    "data center",
    "grid code",
    "NERC",
    "ERCOT",
    "NOGRR282",
    "power systems",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/tech4biz-yasha/ridethrough"
Source = "https://github.com/tech4biz-yasha/ridethrough"

[project.scripts]
ridethrough = "ridethrough.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["ridethrough"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
